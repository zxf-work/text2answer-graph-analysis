<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphAudit side by side</title>
<meta name="description" content="One recorded session put to two systems, each answer checked against the file as it is at that turn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="audit.css">
</head>
<body class="session-page">
<header class="top">
  <a class="brand" href="compare.html" aria-label="GraphAudit, side by side">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="7" cy="9" r="3.2"/><circle cx="25" cy="7" r="3.2"/><circle cx="16" cy="18" r="3.6"/><circle cx="8" cy="26" r="3.2"/><circle cx="26" cy="24" r="3.2"/><path d="M9.5 10.8 14 15.4M22.8 8.6 18.4 15.2M14 20.8 10 23.6M18.6 20.6 23.4 22.6" /></svg>
    GraphAudit
  </a>
  <nav class="views" aria-label="View">
    <a class="view" href="index.html">Single question</a>
    <a class="view" href="session.html">Session</a>
    <span class="view active" aria-current="page">Side by side</span>
  </nav>
  <button type="button" id="btn-theme" class="btn icon" aria-label="Switch between light and dark" title="Light / dark">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<main class="col cmp">
  <section class="panel intro" id="cmp-intro"></section>
  <div class="cmp-cells cmp-head" id="cmp-head"></div>
  <div id="rows" class="timeline"></div>
  <section class="panel turn cmp-total hidden" id="cmp-total"></section>
  <section class="panel dock">
    <div class="askrow"><div id="next-q" class="next-q"></div><button type="button" id="all" class="btn">Show all</button><button type="button" id="next" class="primary">Next turn</button></div>
  </section>
</main>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-box"><div class="modal-head"><h2 id="modal-title"></h2><button type="button" class="btn" id="modal-close">Close</button></div><div id="modal-body"></div></div></div>

<script src="compare.js"></script>
</body>
</html>
